name: Owner-only GitHub Actions workspace
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
concurrency:
  group: village-work-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  workspace:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/work ')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Offline harness tests
        run: python3 -m unittest discover -s tests -p 'test_work_harness.py' -v
      - name: Execute restricted workspace command
        shell: bash
        run: |
          python3 work_harness.py > "$RUNNER_TEMP/work-result.md"
      - name: Persist workspace files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- workspace
          if ! git diff --cached --quiet; then
            git commit -m "Update owner workspace via GitHub Actions"
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            saved=false
            for attempt in 1 2 3; do
              if git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:"$GITHUB_REF_NAME"; then
                saved=true
                break
              fi
              echo "Another repository commit arrived; fetching and rebasing before retry..."
              git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch origin "$GITHUB_REF_NAME"
              if ! git rebase "origin/$GITHUB_REF_NAME"; then
                git rebase --abort || true
                break
              fi
            done
            if [ "$saved" = true ]; then
              printf '\nSaved workspace files to commit %s.\n' "$(git rev-parse --short HEAD)" >> "$RUNNER_TEMP/work-result.md"
            else
              printf '\n⚠️ Files changed in the runner but repository push failed (including retry); check logs.\n' >> "$RUNNER_TEMP/work-result.md"
            fi
          fi
      - name: Reply to owner issue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          from work_harness import github_safe
          contents=(pathlib.Path(os.environ["RUNNER_TEMP"])/"work-result.md").read_text()
          payload={"body":github_safe(contents[:32000])}
          (pathlib.Path(os.environ["RUNNER_TEMP"])/"issue-comment.json").write_text(json.dumps(payload))
          PY
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/${{ github.event.issue.number }}/comments" \
            --input "$RUNNER_TEMP/issue-comment.json"

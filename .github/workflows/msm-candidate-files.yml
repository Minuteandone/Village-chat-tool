name: One-shot overlooked MSM candidate public file inventory
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  inspect:
    if: >-
      github.event.issue.number == 3 &&
      !github.event.issue.pull_request &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/msm-candidate-files'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch public archival file listing metadata only
        run: |
          python3 workspace/msm-investigation/msm_public_candidate_file_details.py > "$RUNNER_TEMP/msm-candidates.txt" 2>&1
          head -c 11000 "$RUNNER_TEMP/msm-candidates.txt"
      - name: Save research metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace/msm-investigation/msm-public-candidate-file-details.json
          if ! git diff --cached --quiet; then
            git commit -m "Record actual files in selected overlooked MSM archive items"
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          fi
      - name: Report to owner
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          t=(p/'msm-candidates.txt').read_text(errors='replace') if (p/'msm-candidates.txt').exists() else 'No output'
          (p/'msg.json').write_text(json.dumps({'body':'### Overlooked MSM file listing results\n\n'+t[:10500]}))
          PY
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/3/comments" --input "$RUNNER_TEMP/msg.json"

name: AI Village all-file same-model topic sorting
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/online-all-file-topics.yml
permissions:
  contents: read
  actions: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install machine-learning dependencies
        run: |
          python3 -m pip install --disable-pip-version-check 'scikit-learn>=1.5,<2' 'numpy>=1.26,<3' 'joblib>=1.3'
          python3 -m py_compile tools/online_all_file_topics.py
      - name: Verify every synthetic file trains and is assigned by same fitted model
        run: |
          mkdir -p scratch
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          out=Path("scratch/test.zip")
          groups=["sailing-quest","electric-songs","flower-art","research-laboratory",
                  "media-cinema","historical-records","bot-project","coding-tools"]
          manifest={"projects":[]}
          with zipfile.ZipFile(out,"w") as z:
              for group in groups:
                  repo="ai-village-agents/village/"+group
                  manifest["projects"].append({"name":repo})
                  for i in range(20):
                      label=group.replace("-", " ")
                      z.writestr("repositories/"+repo+f"/docs/subject-{i:03}.md",
                                 f"# {label}\n{label} and project overview. " * 18)
                  z.writestr("repositories/"+repo+"/assets/cover.png",b"PNG synthetic bytes")
              z.writestr("COMBINED_MANIFEST.json",json.dumps(manifest))
          print("Synthetic ZIP: 168 real files")
          PY
          python3 tools/online_all_file_topics.py \
            --input scratch/test.zip --output scratch/learned \
            --microclusters 8 --merge-distance 0.18 --batch-size 32
          python3 - <<'PY'
          import csv,json,joblib,zipfile
          from pathlib import Path
          base=Path("scratch/learned")
          report=json.loads((base/"LEARNED_TOPICS.json").read_text())
          rows=list(csv.DictReader((base/"FILE_INDEX.csv").open()))
          assert report["training_file_count"]==168,report
          assert report["assigned_file_count"]==168,report
          assert len(rows)==168,len(rows)
          assert len({x["original_archive_path"] for x in rows})==168
          assert sum(t["files"] for t in report["topics"])==168
          model=joblib.load(base/"TRAINED_MODEL.joblib")
          assert hasattr(model["fitted_clusterer"],"predict")
          zips=list((base/"categories").glob("*.zip"))
          found=set()
          for path in zips:
              with zipfile.ZipFile(path) as z:
                  for name in z.namelist():
                      assert name not in found,name
                      found.add(name)
          assert found=={x["original_archive_path"] for x in rows}
          print("PASS: 168/168 files trained, predicted, and preserved; categories",len(zips))
          PY
  full-archive:
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disk and ML environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          python3 -m pip install --disable-pip-version-check 'scikit-learn>=1.5,<2' 'numpy>=1.26,<3' 'joblib>=1.3'
          df -h .
      - name: Download complete AI Village archive
        uses: actions/download-artifact@v4
        with:
          run-id: 41331003002
          artifact-ids: 13093532239
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input
      - name: Train on ALL archived files and assign with SAME fitted model
        run: |
          python3 tools/online_all_file_topics.py \
            --input input/ai-village-gitlab-2741-excluding-argon/ai-village-gitlab-2741-excluding-argon.zip \
            --output output/online-topics \
            --microclusters 48 --merge-distance 0.42 \
            --batch-size 1024 --text-bytes 4096
          python3 - <<'PY'
          import json,csv
          from pathlib import Path
          p=Path("output/online-topics/LEARNED_TOPICS.json")
          report=json.loads(p.read_text())
          assert report["training_file_count"]==2639172,report["training_file_count"]
          assert report["assigned_file_count"]==2639172,report["assigned_file_count"]
          assert report["sampling_exclusions"]==0
          assert sum(t["files"] for t in report["topics"])==2639172
          print("VALIDATED all",report["assigned_file_count"],"files; topics",report["learned_final_topic_count"])
          PY
          df -h .
      - name: Upload learned catalogue trained model and complete file index
        uses: actions/upload-artifact@v4
        with:
          name: ai-village-online-all-files-model-index
          path: |
            output/online-topics/LEARNED_TOPICS.json
            output/online-topics/TRAINED_MODEL.joblib
            output/online-topics/FILE_INDEX.csv
          if-no-files-found: error
          retention-days: 14
      - name: Upload individually named learned category ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: ai-village-online-learned-category-zips
          path: output/online-topics/categories/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

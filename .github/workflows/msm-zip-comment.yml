name: One-shot MSM ZIP comment provenance inspection
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  inspect:
    if: >-
      github.event.issue.number == 3 &&
      !github.event.issue.pull_request &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/msm-zip-comment'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read archive comment, timestamps and ZIP entry metadata only
        shell: bash
        run: |
          set -euo pipefail
          python3 workspace/msm-investigation/server_zip_provenance.py > "$RUNNER_TEMP/zip-provenance-log.txt" 2>&1
          cat "$RUNNER_TEMP/zip-provenance-log.txt"
      - name: Persist derived metadata and no original ZIP bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace/msm-investigation/server-zip-provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "Record ZIP-level Git commit comment and source archive metadata"
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          fi
      - name: Post focused result in issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          log=(p/"zip-provenance-log.txt").read_text(errors="replace") if (p/"zip-provenance-log.txt").exists() else "No archive report"
          msg="### Original MSM game server ZIP header and Git commit comment\n\n"+log[-11500:]
          (p/"post.json").write_text(json.dumps({"body":msg}))
          PY
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/3/comments" --input "$RUNNER_TEMP/post.json"

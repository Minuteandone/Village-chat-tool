name: AI Village Open Chat bridge
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: village-bridge-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  reply:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      !github.event.issue.pull_request &&
      ((github.event_name == 'issues' && startsWith(github.event.issue.title, '[village]')) ||
       (github.event_name == 'issue_comment' && github.event.comment.user.login == github.repository_owner && startsWith(github.event.comment.body, '/village ')))
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Offline bridge tests
        run: python3 -m unittest discover -s tests -v
      - name: Read or post to AI Village
        run: python3 bridge.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VILLAGE_SLUG: ${{ vars.VILLAGE_SLUG }}
          VILLAGE_VISITOR_ID: ${{ secrets.VILLAGE_VISITOR_ID }}
          VILLAGE_DISPLAY_NAME: ${{ vars.VILLAGE_DISPLAY_NAME }}

name: One-shot public archives MSM historical file catalog
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  catalog:
    if: >-
      github.event.issue.number == 3 &&
      !github.event.issue.pull_request &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/msm-expanded-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Query public catalog metadata and file lists
        run: |
          set -euo pipefail
          python3 workspace/msm-investigation/msm_expanded_public_catalog.py > "$RUNNER_TEMP/catalog.txt" 2>&1
          grep '^CATALOG' "$RUNNER_TEMP/catalog.txt"
          head -c 5000 "$RUNNER_TEMP/catalog.txt" | tail -c 3500
      - name: Save metadata JSON only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace/msm-investigation/msm-expanded-public-catalog.json workspace/msm-investigation/msm-expanded-public-catalog-details.json
          if ! git diff --cached --quiet; then
            git commit -m "Save searchable MSM public archive item listings and files"
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          fi
      - name: Post result to issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          s=(p/'catalog.txt').read_text(errors='replace') if (p/'catalog.txt').exists() else 'No log'
          (p/'message.json').write_text(json.dumps({'body':'### Public MSM historical archive catalog check\n\n'+s[:12000]}))
          PY
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/3/comments" --input "$RUNNER_TEMP/message.json"

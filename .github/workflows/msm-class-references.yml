name: One-shot MSM server class cross-reference check
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  inspect:
    if: >-
      github.event.issue.number == 3 &&
      !github.event.issue.pull_request &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/msm-class-references'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read archive and analyze internal Java class references only
        shell: bash
        run: |
          python3 workspace/msm-investigation/server_class_references.py > "$RUNNER_TEMP/class-ref.txt" 2>&1
          tail -n 35 "$RUNNER_TEMP/class-ref.txt"
      - name: Persist metadata and references only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- workspace/msm-investigation/server-class-references.json workspace/msm-investigation/server-class-references.md
          if ! git diff --cached --quiet; then
            git commit -m "Document cross-references among historical MSM Java game classes"
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          fi
      - name: Post condensed references summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          s=(p/"class-ref.txt").read_text(errors="replace") if (p/"class-ref.txt").exists() else "No output"
          (p/"comment.json").write_text(json.dumps({"body":"### MSM server full game-class cross-references\n\nNo source bodies or sensitive information copied.\n\n~~~text\n"+s[-11500:]+"\n~~~"}))
          PY
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/3/comments" --input "$RUNNER_TEMP/comment.json"

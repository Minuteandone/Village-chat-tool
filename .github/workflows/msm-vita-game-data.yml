name: One-shot original 2014 MSM Vita static game database review
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  analyze:
    if: >-
      github.event.issue.number == 3 &&
      !github.event.issue.pull_request &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/msm-vita-game-data'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read verified static Vita game database schema and selected safe game records
        run: |
          set -euo pipefail
          python3 workspace/msm-investigation/msm_vita_2014_game_db_metadata.py > "$RUNNER_TEMP/msm-vita-db.txt" 2>&1
          head -c 10000 "$RUNNER_TEMP/msm-vita-db.txt"
      - name: Commit derived game metadata only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace/msm-investigation/msm-vita-2014-game-db-metadata.json
          if ! git diff --cached --quiet; then
            git commit -m "Preserve 2014 Vita MSM game-data schema and counts as static research"
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          fi
      - name: Post summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          s=(p/"msm-vita-db.txt").read_text(errors="replace") if (p/"msm-vita-db.txt").exists() else "No output"
          (p/"msg.json").write_text(json.dumps({"body":"### Read-only Vita MSM 2014 database metadata\n\n"+s[:10500]}))
          PY
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/3/comments" --input "$RUNNER_TEMP/msg.json"

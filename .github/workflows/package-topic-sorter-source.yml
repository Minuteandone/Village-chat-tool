name: Package AI Village topic-sorter source
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/package-topic-sorter-source.yml
      - tools/discover_village_topics.py
      - tools/online_all_file_topics.py
      - .github/workflows/online-all-file-topics.yml
      - .github/workflows/online-all-files-with-argon.yml
      - .github/workflows/measure-argon-atlas-size.yml
permissions:
  contents: read
jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive the created classifier source and workflows
        run: |
          mkdir -p output
          zip -9 output/ai-village-sorting-source.zip \
            tools/discover_village_topics.py \
            tools/sort_village_files_by_topic.py \
            tools/online_all_file_topics.py \
            .github/workflows/discover-village-topics.yml \
            .github/workflows/sort-village-files.yml \
            .github/workflows/online-all-file-topics.yml \
            .github/workflows/online-all-files-with-argon.yml \
            .github/workflows/measure-argon-atlas-size.yml
      - uses: actions/upload-artifact@v4
        with:
          name: ai-village-sorting-source-zip
          path: output/ai-village-sorting-source.zip
          if-no-files-found: error
          retention-days: 14

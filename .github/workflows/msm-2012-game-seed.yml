name: One-shot historic MSM 2012-labelled game seed review
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  inspect:
    if: >-
      github.event.issue.number == 3 &&
      !github.event.issue.pull_request &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/msm-2012-game-seed'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read non-personal SQL game seed identifiers
        shell: bash
        run: |
          python3 workspace/msm-investigation/server_2012_game_seed.py > "$RUNNER_TEMP/out.txt" 2>&1
          tail -n 80 "$RUNNER_TEMP/out.txt"
      - name: Persist game data research, no player information
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace/msm-investigation/server-2012-game-seed.json workspace/msm-investigation/server-2012-game-seed.md
          if ! git diff --cached --quiet; then
            git commit -m "Document historical MSM game seed IDs, no player data"
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          fi
      - name: Report summary in owner issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          s=(p/'out.txt').read_text(errors='replace') if (p/'out.txt').exists() else 'No output'
          (p/'note.json').write_text(json.dumps({'body':'### Original MSM 2012-labelled game seed review\n\nNo player records exported.\n\n~~~text\n'+s[-13000:]+'\n~~~'}))
          PY
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/3/comments" --input "$RUNNER_TEMP/note.json"

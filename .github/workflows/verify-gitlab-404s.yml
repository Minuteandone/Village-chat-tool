name: Verify GitLab archive 404s with branch listings
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-gitlab-404s.yml
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check the 29 previously unavailable repositories
        run: python3 tools/recover_gitlab_archives.py --kind archive_404 --output output/gitlab-404-branch-verification.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitlab-404-branch-verification
          path: output/gitlab-404-branch-verification.zip
          if-no-files-found: warn
          retention-days: 14
